{% extends "base.html" %}

{% block title %}Login | Codex Studio{% endblock %}

{% block content %}
    <section aria-labelledby="login-title">
        <h1 id="login-title">Login</h1>
        <p>Continue to your AI engineering workspace.</p>
        <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}
            <fieldset>
                <legend>Account credentials</legend>
                {{ form.as_p }}
            </fieldset>
            <button type="submit">Login</button>
        </form>
        <p>New to Codex Studio? <a href="{% url 'accounts:register' %}">Register</a>.</p>
    </section>
{% endblock %}
