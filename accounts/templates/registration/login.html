{% extends "base.html" %}

{% block title %}Login | Codex Studio{% endblock %}

{% block content %}
    <section class="auth-layout" aria-labelledby="login-title">
        <div class="auth-card card">
        <h1 id="login-title">Login</h1>
        <p class="auth-intro">Continue to your AI engineering workspace.</p>
        <form class="form-stack" method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}
            <fieldset>
                <legend>Account credentials</legend>
                {{ form.as_p }}
            </fieldset>
            <button class="button button-primary button-full" type="submit">Login</button>
        </form>
        <p class="auth-switch">New to Codex Studio? <a href="{% url 'accounts:register' %}">Register</a>.</p>
        </div>
    </section>
{% endblock %}
